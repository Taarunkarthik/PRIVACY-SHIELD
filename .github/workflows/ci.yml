name: PrivacyShield CI

on:
  push:
    branches: [dev/privacyshield, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and real services
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_DB: privacyshield
          # Disposable runner only. Runtime roles below receive random passwords.
          # The service is bound to loopback and is never a deployment config.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d privacyshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      target:
        image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: enterprise_demo
          # Bootstrap only; the provisioning step switches TCP to SCRAM.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d enterprise_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      pristine:
        # An empty server with none of the PrivacyShield roles: what a newly
        # created managed instance looks like. The single-service hosting test
        # creates a non-superuser admin on it and runs the real bootstrap.
        image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          # Disposable runner only, bound to loopback. A password (rather than
          # trust) keeps SCRAM on, so the test proves the derived role passwords.
          POSTGRES_PASSWORD: disposable-ci-superuser
        ports:
          - 127.0.0.1:5434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
        shell: bash
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: '["http://localhost:8080"]'
      TARGET_ALLOWED_HOSTS: '["127.0.0.1"]'
      TEST_TARGET_HOST: 127.0.0.1
      TEST_TARGET_PORT: "5433"
      CELERY_QUEUE: privacyshield-ci
      OLLAMA_BASE_URL: http://127.0.0.1:11435
      TEST_OLLAMA_BASE_URL: http://127.0.0.1:11435
      TEST_PRISTINE_POSTGRES_URL: postgresql://postgres:disposable-ci-superuser@127.0.0.1:5434/postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev
      - name: Provision isolated database roles and ephemeral configuration
        run: |
          uv run python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          import psycopg
          from psycopg import sql
          from cryptography.fernet import Fernet

          migrator_password = secrets.token_hex(24)
          app_password = secrets.token_hex(24)
          target_passwords = {
              name: secrets.token_hex(24)
              for name in ("superuser", "scanner", "deployer", "reader")
          }
          key = Fernet.generate_key().decode()
          for value in (migrator_password, app_password, key, *target_passwords.values()):
              print(f"::add-mask::{value}")
          with psycopg.connect(
              "host=127.0.0.1 dbname=privacyshield user=postgres", autocommit=True
          ) as conn:
              for name, password in (
                  ("ps_migrator", migrator_password), ("ps_app", app_password)
              ):
                  conn.execute(sql.SQL(
                      "CREATE ROLE {} LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE "
                      "NOBYPASSRLS PASSWORD {}"
                  ).format(sql.Identifier(name), sql.Literal(password)))
              conn.execute("ALTER DATABASE privacyshield OWNER TO ps_migrator")
              conn.execute("REVOKE ALL ON DATABASE privacyshield FROM PUBLIC")
              conn.execute("GRANT CONNECT ON DATABASE privacyshield TO ps_migrator, ps_app")
              conn.execute("ALTER SCHEMA public OWNER TO ps_migrator")
              conn.execute("REVOKE CREATE ON SCHEMA public FROM PUBLIC")
              conn.execute("GRANT USAGE ON SCHEMA public TO ps_app")
          with psycopg.connect(
              "host=127.0.0.1 port=5433 dbname=enterprise_demo user=postgres",
              autocommit=True,
          ) as conn:
              conn.execute(sql.SQL("ALTER ROLE postgres PASSWORD {}").format(
                  sql.Literal(target_passwords["superuser"])
              ))
          config = {
              "DATABASE_URL": (
                  "postgresql+psycopg://ps_app:" + app_password
                  + "@127.0.0.1:5432/privacyshield"
              ),
              "MIGRATION_DATABASE_URL": (
                  "postgresql+psycopg://ps_migrator:" + migrator_password
                  + "@127.0.0.1:5432/privacyshield"
              ),
              "CREDENTIAL_ENCRYPTION_KEY": key,
              "SCANNER_PASSWORD": target_passwords["scanner"],
              "DEPLOYER_PASSWORD": target_passwords["deployer"],
              "READER_PASSWORD": target_passwords["reader"],
              "TEST_TARGET_SCANNER_PASSWORD": target_passwords["scanner"],
              "TEST_TARGET_DEPLOYER_PASSWORD": target_passwords["deployer"],
              "TEST_TARGET_READER_PASSWORD": target_passwords["reader"],
              "TEST_TARGET_SUPERUSER_PASSWORD": target_passwords["superuser"],
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for name, value in config.items():
                  stream.write(f"{name}={value}\n")
          PY
      - name: Provision separate synthetic target with repository fixtures
        env:
          TARGET_CONTAINER: ${{ job.services.target.id }}
        run: |
          docker exec "$TARGET_CONTAINER" mkdir -p /opt/privacyshield
          docker cp ../infra/postgres/demo.sql "$TARGET_CONTAINER:/opt/privacyshield/demo.sql"
          docker exec -i -e SCANNER_PASSWORD -e DEPLOYER_PASSWORD -e READER_PASSWORD \
            "$TARGET_CONTAINER" sh < ../infra/postgres/target-init.sh
          docker exec -i -u postgres "$TARGET_CONTAINER" sh <<'SH'
          sed -i '/^host/s/[[:space:]]trust[[:space:]]*$/ scram-sha-256/' "$PGDATA/pg_hba.conf"
          pg_ctl reload -D "$PGDATA"
          SH
          uv run python - <<'PY'
          import os
          import time
          import psycopg

          # Verify authentication after asynchronous pg_hba reload, without
          # exposing either the generated credential or the expected failure.
          settings = dict(host="127.0.0.1", port=5433, dbname="enterprise_demo",
                          user="ps_scanner", connect_timeout=3)
          for attempt in range(20):
              try:
                  with psycopg.connect(**settings, password="invalid-ci-password"):
                      pass
              except psycopg.OperationalError:
                  break
              time.sleep(0.1)
          else:
              raise SystemExit("Target did not enable password authentication")
          with psycopg.connect(**settings, password=os.environ["SCANNER_PASSWORD"]) as conn:
              assert conn.execute("SELECT count(*) FROM enterprise.customers").fetchone()[0] == 100
          print("Target initialized from repository fixtures; password authentication confirmed")
          PY
      - name: Static checks and unit tests
        run: |
          uv run ruff check .
          uv run pytest -m "not integration"
      - name: Apply and check migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Start controlled HTTP AI double and a separate Linux Celery worker
        run: |
          uv run python tests/support/fake_ollama.py --host 127.0.0.1 --port 11435 > "$RUNNER_TEMP/privacyshield-ai-double.log" 2>&1 &
          echo "AI_DOUBLE_PID=$!" >> "$GITHUB_ENV"
          uv run celery -A app.workers.celery_app:celery_app worker \
            --loglevel=WARNING --concurrency=1 --beat --schedule="$RUNNER_TEMP/privacyshield-beat" > "$RUNNER_TEMP/privacyshield-worker.log" 2>&1 &
          echo "WORKER_PID=$!" >> "$GITHUB_ENV"
      - name: Real control/target PostgreSQL, discovery, session, and worker tests
        run: uv run pytest -m integration
      - name: Stop worker
        if: always()
        run: |
          if [ -n "${WORKER_PID:-}" ]; then
            kill "$WORKER_PID" 2>/dev/null || true
          fi
          if [ -n "${AI_DOUBLE_PID:-}" ]; then
            kill "$AI_DOUBLE_PID" 2>/dev/null || true
          fi

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Type checking
        run: npm run typecheck
      - name: Component tests
        run: npm test
      - name: Production build
        run: npm run build

  image:
    # The repository-root Dockerfile is what the hosted (Render) service builds.
    # This job builds it and runs the result the way the platform does: one
    # container, one PostgreSQL instance whose admin user is not a superuser,
    # no Redis, no worker.
    name: All-in-one image (build and smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          # Disposable runner only, bound to loopback. Setting a password keeps
          # SCRAM on for TCP, so the derived role passwords are really checked.
          POSTGRES_PASSWORD: disposable-ci-superuser
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        shell: bash
    env:
      IMAGE: privacyshield-all-in-one:ci
      BASE_URL: http://127.0.0.1:10000
      ADMIN_EMAIL: ci-admin@example.com
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the image from the repository root
        run: docker build -f Dockerfile -t "$IMAGE" .
      - name: Image contents
        run: |
          test "$(docker run --rm "$IMAGE" id -u)" = "10001"
          docker run --rm "$IMAGE" test -s /app/static/index.html
          docker run --rm "$IMAGE" sh -c 'ls /app/static/assets/*.js > /dev/null'
          docker run --rm "$IMAGE" test -f /app/scripts/render/start-all.sh
          docker run --rm "$IMAGE" sh -c 'test "$STATIC_DIR" = /app/static && test "$JOB_RUNNER" = inline'
          # Development tools stay out of the production image.
          docker run --rm "$IMAGE" python -c "import importlib.util as u, sys; sys.exit(u.find_spec('pytest') is not None)"
      - name: Create the non-superuser admin a managed platform provides
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          DB_ADMIN_PASSWORD="$(openssl rand -hex 16)"
          APP_SECRET="$(openssl rand -hex 32)"
          ADMIN_PASSWORD="$(openssl rand -hex 12)"
          for value in "$DB_ADMIN_PASSWORD" "$APP_SECRET" "$ADMIN_PASSWORD"; do
            echo "::add-mask::$value"
          done
          docker exec -i -u postgres "$PG_CONTAINER" \
            psql -v ON_ERROR_STOP=1 -v admin_password="$DB_ADMIN_PASSWORD" <<'SQL'
          CREATE ROLE render_admin LOGIN CREATEDB CREATEROLE PASSWORD :'admin_password';
          CREATE DATABASE render_main OWNER render_admin;
          SQL
          {
            echo "DB_ADMIN_PASSWORD=$DB_ADMIN_PASSWORD"
            echo "APP_SECRET=$APP_SECRET"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Start the container with only the variables a deployment sets
        run: |
          docker run -d --name privacyshield --network host \
            -e PORT=10000 \
            -e CONTROL_ADMIN_URL="postgresql://render_admin:${DB_ADMIN_PASSWORD}@127.0.0.1:5432/render_main" \
            -e BOOTSTRAP_DB_SSLMODE=disable \
            -e APP_SECRET -e ADMIN_EMAIL -e ADMIN_PASSWORD \
            "$IMAGE"
      - name: Health, readiness, frontend, sign-in and a real scan over HTTP
        run: |
          python3 scripts/check_hosted.py --base-url "$BASE_URL" --email "$ADMIN_EMAIL" --scan --wait 180
          test "$(curl -fsS "$BASE_URL/health")" = "ok"
          curl -fsS "$BASE_URL/api/v1/health/ready" | grep -F '"redis":"not_used"'
      - name: Startup log says what happened and holds no secret
        run: |
          docker logs privacyshield > "$RUNNER_TEMP/container.log" 2>&1
          for line in \
            "Bootstrap: the admin user is not a superuser" \
            "Bootstrap: creating database enterprise_demo" \
            "Bootstrap: control database is now owned by ps_migrator" \
            "Bootstrap complete." \
            "Administrator created" \
            "Demo connection registered" \
            "Serving frontend from /app/static, jobs run in-process" \
            "Job started: scan"; do
            grep -qF -- "$line" "$RUNNER_TEMP/container.log" || { echo "Missing log line: $line"; exit 1; }
          done
          for value in "$DB_ADMIN_PASSWORD" "$APP_SECRET" "$ADMIN_PASSWORD"; do
            if grep -qF -- "$value" "$RUNNER_TEMP/container.log"; then
              echo "A secret reached the container log"; exit 1
            fi
          done
      - name: A restart finds everything in place
        run: |
          docker restart privacyshield
          python3 scripts/check_hosted.py --base-url "$BASE_URL" --email "$ADMIN_EMAIL" --wait 180
          docker logs privacyshield 2>&1 | grep -F "Administrator already exists"
          docker logs privacyshield 2>&1 | grep -F "Demo connection already registered"
      - name: Container log
        if: always()
        run: docker logs privacyshield 2>&1 | tail -n 200 || true
