# Render Blueprint for PrivacyShield on the free plan.
#
# Exactly two resources, both free:
#   - one web service that serves the API, the React frontend and the background
#     jobs from a single container (repository-root Dockerfile);
#   - one Postgres instance. The control-plane database and the synthetic
#     "enterprise_demo" target live in it as two separate databases; the service
#     creates the second one, and all database roles, when it starts.
# No worker, no Key Value (Redis), no shell access needed.
#
# Step-by-step instructions, limits and troubleshooting: docs/deploy-render.md.
# The earlier multi-service layout, which needs paid plans, is render.paid.yaml.
#
# Status: every step this file triggers has been run against a real PostgreSQL
# server with a non-superuser admin (docs/verification-render.md), but this file
# has not been applied to a live Render account. Treat the first sync as a check.

databases:
  - name: privacyshield-db
    # Must not be "enterprise_demo": that name is used for the demo database.
    databaseName: privacyshield
    plan: free
    region: singapore
    # The version the bootstrap was tested on.
    postgresMajorVersion: "16"
    ipAllowList: [] # private network only; the web service uses the internal URL

services:
  - type: web
    # The name of the existing service. Render applies this file to a service
    # with the same name instead of creating a second one.
    name: PRIVACY-SHIELD
    runtime: docker
    plan: free
    # The database and the service must be in the same region.
    region: singapore
    branch: dev/privacyshield
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Ready means: database reachable, migrations applied, job threads alive.
    healthCheckPath: /api/v1/health/ready
    envVars:
      # The instance's own (non-superuser) user. Used only while starting, to
      # create the least-privilege roles; the server then runs as ps_app.
      - key: CONTROL_ADMIN_URL
        fromDatabase:
          name: privacyshield-db
          property: connectionString
      # One secret. The encryption key and every database role password are
      # derived from it, so they stay the same across restarts and redeploys.
      # Do not change it after the first deploy.
      - key: APP_SECRET
        generateValue: true
      # The first administrator, created at startup if that email has no account.
      # Render asks for these when the Blueprint is first created. The password
      # needs 12 to 128 characters.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
