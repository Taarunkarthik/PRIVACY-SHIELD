# Render Blueprint for PrivacyShield.
#
# Deploys the full stack on Render: the FastAPI web service, the Celery worker,
# the nginx frontend proxy, a Render Key Value (Redis) broker, and two Render
# Postgres databases (control plane + synthetic target).
#
# See docs/deploy-render.md. This manifest is validated structurally but has NOT
# been exercised against a live Render account. Secrets are generated by Render
# or injected from referenced resources; do not hardcode any here.

envVarGroups:
  # Shared secrets generated once and injected into every service. The role
  # passwords are also read by the startup bootstrap to create the least-
  # privilege database roles. Read them from the Render dashboard when you
  # register the synthetic target connection.
  - name: privacyshield-secrets
    envVars:
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: APP_DATABASE_PASSWORD
        generateValue: true
      - key: MIGRATOR_PASSWORD
        generateValue: true
      - key: SCANNER_PASSWORD
        generateValue: true
      - key: DEPLOYER_PASSWORD
        generateValue: true
      - key: READER_PASSWORD
        generateValue: true

databases:
  - name: privacyshield-control
    databaseName: privacyshield
    region: oregon
    plan: free
  - name: privacyshield-target
    databaseName: enterprise_demo
    region: oregon
    plan: free

services:
  - type: keyvalue
    name: privacyshield-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal-only; no public access

  - type: web
    name: privacyshield-api
    runtime: docker
    region: oregon
    plan: 1c-2g
    branch: dev/privacyshield
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh /app/scripts/render/start-api.sh
    healthCheckPath: /api/v1/health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: privacyshield-secrets
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: privacyshield-redis
          property: connectionString
      - key: CONTROL_ADMIN_URL
        fromDatabase:
          name: privacyshield-control
          property: connectionString
      - key: TARGET_ADMIN_URL
        fromDatabase:
          name: privacyshield-target
          property: connectionString
      # The frontend proxies /api on the same origin, so the API's origin check
      # is satisfied by the request Host; no cross-service URL is required.
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_HOURS
        value: "12"

  - type: worker
    name: privacyshield-worker
    runtime: docker
    region: oregon
    plan: 1c-2g
    branch: dev/privacyshield
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh /app/scripts/render/start-worker.sh
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: privacyshield-secrets
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: privacyshield-redis
          property: connectionString
      - key: CONTROL_ADMIN_URL
        fromDatabase:
          name: privacyshield-control
          property: connectionString
      - key: TARGET_ADMIN_URL
        fromDatabase:
          name: privacyshield-target
          property: connectionString

  - type: web
    name: privacyshield-web
    runtime: docker
    region: oregon
    plan: free
    branch: dev/privacyshield
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /health
    envVars:
      - key: API_HOSTPORT
        value: privacyshield-api:10000
